[package]
name = "eoka-sdk"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Rust SDK for controlling eoka browser automation sessions"
repository = "https://github.com/shrimp-software/eoka-tools"
homepage = "https://github.com/shrimp-software/eoka-tools"
documentation = "https://docs.rs/eoka-sdk"
readme = "README.md"
authors = ["cbxss"]

[dependencies]
anyhow = { workspace = true }
eoka = "0.7.0"
eoka-protocol = { path = "../eoka-protocol", version = "0.4.0" }
tokio = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
