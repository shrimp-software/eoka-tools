[package]
name = "eoka-sdk"
version = "0.9.1"
edition = "2021"
license = "MIT"
description = "Rust SDK for controlling eoka browser automation sessions"
repository = "https://github.com/shrimp-software/eoka-tools"
homepage = "https://github.com/shrimp-software/eoka-tools"
documentation = "https://docs.rs/eoka-sdk"
readme = "README.md"
authors = ["cbxss"]

[dependencies]
anyhow = { workspace = true }
eoka = { workspace = true }
eoka-protocol = { workspace = true }
tokio = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }

sha2 = "0.11"
libc = "0.2"
