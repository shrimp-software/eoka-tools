[package]
name = "eoka-runner"
version = "0.7.10"
edition.workspace = true
license.workspace = true
description = "Config-based browser automation — define actions in YAML, execute deterministically"
keywords = ["browser", "automation", "yaml", "scripting", "cli"]
categories = ["web-programming", "development-tools", "command-line-utilities"]
repository.workspace = true
documentation = "https://docs.rs/eoka-runner"
readme = "README.md"
authors.workspace = true

[[bin]]
name = "eoka-runner"
path = "src/bin/main.rs"

[dependencies]
eoka = { workspace = true }
eoka-proxy = { workspace = true }
eoka-email = { workspace = true, features = ["async"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

eoka-server = { workspace = true }
eoka-protocol = { workspace = true }
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
serde_json = "1"
