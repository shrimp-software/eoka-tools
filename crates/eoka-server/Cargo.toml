[package]
name = "eoka-server"
version = "0.6.1"
edition = "2021"
license = "MIT"
description = "Shared browser runtime and sidecar process for eoka browser automation"
keywords = ["browser", "automation", "sidecar", "json-rpc"]
categories = ["web-programming", "development-tools"]
repository = "https://github.com/shrimp-software/eoka-tools"
homepage = "https://github.com/shrimp-software/eoka-tools"
authors = ["cbxss"]

[[bin]]
name = "eoka-server"
path = "src/main.rs"

[dependencies]
eoka = "=0.7.3"
eoka-protocol = { path = "../eoka-protocol", version = "0.6.0" }
eoka-proxy = { path = "../eoka-proxy", version = "0.2.0" }
url = "2"
libc = "0.2"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
captcha = { package = "eoka-captcha", version = "0.1.1", path = "../captcha" }

rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
fs2 = "0.4"

[build-dependencies]
toml = "0.8"

[dev-dependencies]
tempfile = "3"
dirs = "5"
reqwest = { version = "0.12", features = ["json"] }
