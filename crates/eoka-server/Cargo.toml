[package]
name = "eoka-server"
version = "0.8.1"
edition = "2021"
license = "MIT"
description = "Shared browser runtime and sidecar process for eoka browser automation"
keywords = ["browser", "automation", "sidecar", "json-rpc"]
categories = ["web-programming", "development-tools"]
repository = "https://github.com/shrimp-software/eoka-tools"
homepage = "https://github.com/shrimp-software/eoka-tools"
authors = ["cbxss"]

[[bin]]
name = "eoka-server"
path = "src/main.rs"

[dependencies]
eoka = "=0.9.1"
eoka-protocol = { workspace = true }
eoka-proxy = { workspace = true }
url = "2"
libc = "0.2"
parking_lot = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
captcha = { workspace = true }

rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hmac = "0.13"
fs2 = "0.4"

[build-dependencies]
toml = "1.1"

[dev-dependencies]
tempfile = "3"
dirs = "7"
reqwest = { version = "0.13", features = ["json"] }
