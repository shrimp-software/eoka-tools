[package]
name = "eoka-captcha"
version = "0.1.3"
edition.workspace = true
license.workspace = true
description = "Optional CAPTCHA solver integrations for eoka"
repository.workspace = true

[features]
default = ["anti-captcha"]
anti-captcha = ["dep:ureq", "dep:serde", "dep:tokio", "dep:url"]

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json", "platform-verifier"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt"], optional = true }
url = { version = "2", optional = true }
