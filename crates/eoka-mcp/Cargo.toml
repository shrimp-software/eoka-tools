[package]
name = "eoka-mcp"
version = "0.11.2"
edition.workspace = true
license.workspace = true
description = "MCP server for eoka browser automation tools"
keywords = ["browser", "automation", "ai-agent", "mcp", "llm"]
categories = ["web-programming", "development-tools"]
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/eoka-mcp"
readme = "README.md"
authors.workspace = true

[[bin]]
name = "eoka-mcp"
path = "src/main.rs"

[dependencies]
eoka-server = { workspace = true }
eoka-protocol = { workspace = true }
captcha = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.0.1", features = ["server", "transport-io"] }
schemars = "1.0"
anyhow = "1"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3.0.1", features = ["client"] }
