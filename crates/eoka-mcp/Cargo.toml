[package]
name = "eoka-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for eoka browser automation tools"
keywords = ["browser", "automation", "ai-agent", "mcp", "llm"]
categories = ["web-programming", "development-tools"]
repository.workspace = true
documentation = "https://docs.rs/eoka-mcp"
readme = "README.md"
authors.workspace = true

[[bin]]
name = "eoka-mcp"
path = "src/main.rs"

[features]
default = ["anti-captcha", "datadome"]
anti-captcha = ["eoka-server/anti-captcha", "eoka-solvers/anti-captcha"]
datadome = ["eoka-server/datadome"]

[dependencies]
eoka-server = { workspace = true }
eoka-protocol = { workspace = true }
eoka-solvers = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.0.1", features = ["server", "transport-io"] }
schemars = "1.0"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3.0.1", features = ["client"] }
