[package]
name = "eoka-mcp"
version = "0.7.2"
edition = "2021"
license = "MIT"
description = "MCP server for eoka browser automation tools"
keywords = ["browser", "automation", "ai-agent", "mcp", "llm"]
categories = ["web-programming", "development-tools"]
repository = "https://github.com/shrimp-software/eoka-tools"
homepage = "https://github.com/shrimp-software/eoka-tools"
documentation = "https://docs.rs/eoka-mcp"
readme = "README.md"
authors = ["cbxss"]

[[bin]]
name = "eoka-mcp"
path = "src/main.rs"

[dependencies]
eoka-server = { workspace = true }
eoka-proxy = { workspace = true }
eoka-protocol = { workspace = true }
captcha = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.0.1", features = ["server", "transport-io"] }
schemars = "1.0"
anyhow = "1"
base64 = "0.23"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
