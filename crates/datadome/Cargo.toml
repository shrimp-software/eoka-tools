[package]
name = "eoka-datadome"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local DataDome slider captcha solver for the eoka ecosystem"
repository = "https://github.com/shrimp-software/eoka-tools"

[features]
test-fixtures = ["tokio/net", "tokio/io-util"]

[dependencies]
eoka = "0.5.12"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["time", "rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
libc = "0.2"
zeroize = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
