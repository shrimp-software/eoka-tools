[package]
name = "eoka-cli"
version = "0.14.6"
edition.workspace = true
license.workspace = true
description = "Browser automation CLI for AI agents and pentesting"
repository.workspace = true
authors.workspace = true

[[bin]]
name = "eoka"
path = "src/main.rs"

[dependencies]
uuid = { version = "1", features = ["v4"] }
eoka-protocol = { workspace = true }
eoka-server = { workspace = true }
eoka-sdk = { workspace = true }
eoka-tack = { workspace = true }
captcha = { workspace = true }
eoka = { workspace = true }
tack-core = { workspace = true }
tack-runtime-quickjs = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
libc = "0.2"
anyhow = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.11"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
shlex = "2.0"
eoka-datadome = { workspace = true, features = ["test-fixtures"] }
