[package]
name = "eoka-cli"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Browser automation CLI for AI agents and pentesting"
repository = "https://github.com/shrimp-software/eoka-tools"
authors = ["cbxss"]

[[bin]]
name = "eoka"
path = "src/main.rs"

[dependencies]
eoka-protocol = { version = "0.2.0", path = "../eoka-protocol" }
eoka-proxy = { path = "../eoka-proxy", version = "0.2.0" }
eoka-server = { version = "0.2.0", path = "../eoka-server" }
eoka-sdk = { version = "0.3.0", path = "../eoka-sdk" }
eoka-tack = { version = "0.2.0", path = "../eoka-tack" }
captcha = { package = "eoka-captcha", version = "0.1.1", path = "../captcha" }
eoka = "0.5.9"
tack-core = { workspace = true }
tack-runtime-quickjs = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
base64 = "0.22"
anyhow = { workspace = true }
url = "2"
chrono = "0.4"
async-trait = { workspace = true }
