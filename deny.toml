[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained crates we depend on directly; transitive ones
# (pin-utils via futures, unsafe-libyaml via serde_yaml) have no fix to take.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC",
  "0BSD", "Zlib", "Unicode-3.0", "MPL-2.0", "BSL-1.0", "Unlicense",
  # Mozilla root certificate data (webpki-root-certs, via reqwest 0.13).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow" # workspace path dependencies

[sources]
unknown-registry = "deny"
unknown-git = "deny"
