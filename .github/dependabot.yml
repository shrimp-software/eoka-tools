version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      rust-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /clients/node
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      node-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 7 has no compiler API yet; scripts/typecheck.mjs needs it.
      - dependency-name: typescript
        versions: [">=7"]
      # Keep Node types on the major in package.json "engines".
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /clients/go
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      go-deps:
        patterns: ["*"]
