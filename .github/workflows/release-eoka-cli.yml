name: Release eoka-cli
on:
  push:
    tags: ["eoka-cli-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Published CLI tag to build
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Cross-compiled on Apple silicon (the Intel pool is the slowest to
          # schedule); the --version check runs under Rosetta 2.
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: shrimp-software/eoka/.github/actions/rust@2e108f041f487df9acc2b04fe5508ec4bf041a56
        with:
          targets: ${{ matrix.target }}
      - name: Ensure Rosetta 2 for the x86_64 macOS binary
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
      - name: Verify tag and build registry dependencies
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/eoka-cli/Cargo.toml | head -1)"
          test "$RELEASE_TAG" = "eoka-cli-v$version"
          cargo build --release --locked -p eoka-cli --target '${{ matrix.target }}'
          target/${{ matrix.target }}/release/eoka --version
          mkdir -p dist
          tar -czf dist/eoka-cli-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release eoka
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eoka-cli-${{ matrix.target }}
          path: dist/*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes 'CLI binaries with SHA-256 checksums.'
          gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS
