name: Release

# One release per version: the tag v<version> gets the eoka and eoka-mcp
# tarballs, the qualified eoka-server binaries and one SHA256SUMS, and npm
# publishes the same qualified server binaries after approval.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit currently at main and tagged v<version>; releases the workspace version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  gate:
    name: Verify source
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
      - name: Publish only the dispatched main commit with consistent versions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          if grep -q '^\[patch.crates-io\]' Cargo.toml; then echo "Remove [patch.crates-io] before publishing"; exit 1; fi
          mise exec -- node scripts/bump-release.mjs --check
      - name: Tag v<version> points at the source commit
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          tagged="$(git ls-remote origin "refs/tags/v${version}" "refs/tags/v${version}^{}" | awk '{ print $1 }' | tail -n 1)"
          test "$tagged" = "$SOURCE_SHA" || { echo "Tag v${version} is at '${tagged}', not ${SOURCE_SHA}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI and MCP binaries (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            container: ubuntu:22.04
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: ubuntu:22.04
          # Cross-compiled on Apple silicon (the Intel pool is the slowest to
          # schedule); the --version checks run under Rosetta 2.
          - os: macos-15
            target: x86_64-apple-darwin
            container: null
          - os: macos-15
            target: aarch64-apple-darwin
            container: null
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install the glibc 2.35 build baseline
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev ca-certificates curl git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: shrimp-software/eoka/.github/actions/rust@e6662c5f7faf03b5f6c2979903367003c426b5d4
        with:
          targets: ${{ matrix.target }}
      - name: Ensure Rosetta 2 for the x86_64 macOS binaries
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
      - name: Build eoka and eoka-mcp from registry dependencies
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -eu
          cargo build --release --locked -p eoka-cli -p eoka-mcp --target "$TARGET"
          for binary in eoka eoka-mcp; do
            test "$("target/$TARGET/release/$binary" --version)" = "$binary $VERSION"
          done
          mkdir -p dist
          tar -czf "dist/eoka-$TARGET.tar.gz" -C "target/$TARGET/release" eoka eoka-mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  qualify:
    name: Qualify exact publication payload
    needs: gate
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/qualify-node-release.yml
    with:
      source_ref: ${{ github.sha }}
      publication: true

  github-release:
    name: GitHub release v${{ needs.gate.outputs.version }}
    needs: [gate, cli, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.gate.outputs.version }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: node-native-*
          path: native
          merge-multiple: true
      - name: Collect qualified binaries and checksums
        run: |
          set -euo pipefail
          for asset in eoka-server-linux-amd64 eoka-server-linux-arm64 eoka-server-darwin-amd64 eoka-server-darwin-arm64 eoka-server-windows-amd64.exe; do
            cp "native/${asset}" "dist/${asset}"
          done
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            test -f "dist/eoka-${target}.tar.gz"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist
          cat dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes dist/*
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      # Keeps the installer honest: with no version given it must find and
      # install the release that was just published.
      - name: Installer resolves this release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EOKA_INSTALL_DIR: ${{ runner.temp }}/eoka-install
        run: |
          set -eu
          sh crates/eoka-cli/scripts/install.sh
          test "$("$EOKA_INSTALL_DIR/eoka" --version)" = "eoka $VERSION"
          test "$("$EOKA_INSTALL_DIR/eoka-mcp" --version)" = "eoka-mcp $VERSION"

  publish:
    name: Publish platform packages then SDK to latest
    needs: [gate, qualify]
    runs-on: ubuntu-22.04
    environment:
      name: npm-prerelease
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: node-release-candidates
          path: packages
      - name: Publish with trusted OIDC and provenance
        run: mise exec -- node clients/node/scripts/publish-release.mjs publish packages

  registry-smoke:
    name: Clean registry install and browser smoke
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
      - name: Install Chrome runtime dependencies
        run: .github/scripts/chrome-deps.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: node-release-candidates
          path: packages
      - name: Verify registry integrity and signatures, then run a browser smoke
        run: mise exec -- node clients/node/scripts/publish-release.mjs smoke packages
