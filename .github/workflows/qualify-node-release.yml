name: Qualify Node release

on:
  # Every npm publish and server release runs this in full; pull requests
  # only when the release pipeline itself changes.
  pull_request:
    paths:
      - 'clients/node/scripts/**'
      - 'clients/node/release-manifest.json'
      - 'clients/node/package.json'
      - 'clients/node/package-lock.json'
      - '.github/workflows/qualify-node-release.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Tools source ref to qualify (resolved to an immutable revision)
        type: string
        required: false
      publication:
        description: Require released core and publishable manifests
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      publication:
        type: boolean
        default: false
    outputs:
      source-sha:
        value: ${{ jobs.source.outputs.sha }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: Native release build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            container: ubuntu:22.04
            asset: eoka-server-linux-amd64
            ext: ''
          - platform: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: ubuntu:22.04
            asset: eoka-server-linux-arm64
            ext: ''
          # Cross-compiled on Apple silicon (the Intel runner pool is the
          # slowest to schedule and build); its target tests run under
          # Rosetta 2, and packed qualification still runs on Intel hardware.
          - platform: darwin-x64
            target: x86_64-apple-darwin
            os: macos-15
            container: null
            asset: eoka-server-darwin-amd64
            ext: ''
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-15
            container: null
            asset: eoka-server-darwin-arm64
            ext: ''
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            os: windows-2025
            container: null
            asset: eoka-server-windows-amd64.exe
            ext: .exe
    steps:
      - name: Install GNU baseline dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev ca-certificates curl git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}
      - name: Ensure Rosetta 2 for x86_64 target tests
        if: matrix.platform == 'darwin-x64'
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
      # Caches are written only by publication runs on main, which pull_request
      # runs can read but never write into. A publication build therefore only
      # ever restores artifacts produced by an earlier publication build.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          CARGO_HOME: ${{ runner.temp }}/qualification-cargo
        with:
          key: ${{ matrix.target }}
          save-if: ${{ inputs.publication && github.ref == 'refs/heads/main' }}
      - name: Build immutable native source
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          EXT: ${{ matrix.ext }}
          CARGO_HOME: ${{ runner.temp }}/qualification-cargo
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME" dist
          cargo build --release --locked --target "$TARGET" -p eoka-server
          cargo test --release --locked --target "$TARGET" -p eoka-server recordings::
          cargo test --release --locked --target "$TARGET" -p eoka-server operations::tests::live_runtime_is_not_recovered_by_a_second_owner -- --exact
          cp "target/$TARGET/release/eoka-server$EXT" "dist/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: node-native-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  stage:
    needs: [source, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: node-native-*
          path: native
          merge-multiple: true
      - name: Build SDK and stage all native artifacts
        env:
          PUBLICATION: ${{ inputs.publication || false }}
        run: |
          set -euo pipefail
          mise exec -- npm --prefix clients/node ci --ignore-scripts --omit=optional
          mise run node-build
          args=()
          if [[ "$PUBLICATION" == true ]]; then args+=(--publication); fi
          mise exec -- node clients/node/scripts/stage-release.mjs --artifacts native --output stage "${args[@]}"
          mise exec -- node clients/node/scripts/qualify-release.mjs --pack-only --stage stage --output packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: node-release-candidates
          path: packages/
          if-no-files-found: error
          retention-days: 14

  runtime:
    needs: [source, stage]
    name: Packed runtime qualification (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-22.04
          - platform: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - platform: darwin-x64
            os: macos-15-intel
          - platform: darwin-arm64
            os: macos-15
          - platform: win32-x64
            os: windows-2025
    steps:
      - name: Install Linux browser dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git xz-utils unzip ffmpeg libnss3 libgbm1 fonts-liberation
          # Ubuntu 24.04 AppArmor blocks the user namespaces Chrome's sandbox needs.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - name: Install macOS decoder
        if: startsWith(matrix.platform, 'darwin-')
        run: brew install ffmpeg
      - name: Install Windows decoder
        if: matrix.platform == 'win32-x64'
        run: choco install ffmpeg --yes --no-progress
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: node-release-candidates
          path: packages
      - name: Exercise packed native SDK outside repository
        run: mise exec -- node clients/node/scripts/qualify-release.mjs --packages packages --cache "$RUNNER_TEMP/b"
