name: Publish

# Auto-publishes any workspace crate whose Cargo.toml version is ahead of
# crates.io. Runs on every push to main; safe to run repeatedly because
# already-published versions are skipped.

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish missing crate versions
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish each crate whose version is not on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          UA="eoka-tools-publish (${{ github.repository }})"

          if grep -q '^\[patch.crates-io\]' Cargo.toml; then
            echo "Remove local [patch.crates-io] overrides before publishing eoka-tools."
            exit 1
          fi

          # Stable publish order: leaf deps first so dependents resolve.
          for crate in captcha eoka-proxy eoka-protocol eoka-sdk eoka-runner eoka-email eoka-server eoka-mcp eoka-tack eoka-cli; do
            manifest="crates/${crate}/Cargo.toml"
            [ -f "$manifest" ] || continue

            package_name=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg manifest "$(realpath "$manifest")" \
                '.packages[] | select(.manifest_path == $manifest) | .name')
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg manifest "$(realpath "$manifest")" \
                '.packages[] | select(.manifest_path == $manifest) | .version')
            tag="${crate}-v${version}"
            echo "::group::${package_name} @ ${version}"

            api_url="https://crates.io/api/v1/crates/${package_name}/${version}"
            http_status=$(curl -sS -o /dev/null -w "%{http_code}" -A "$UA" "$api_url" || echo 000)
            if [ "$http_status" = "200" ]; then
              echo "${package_name} ${version} already on crates.io — skip"
              echo "::endgroup::"
              continue
            fi

            echo "Publishing ${package_name} ${version}"
            cargo publish --manifest-path "$manifest" --token "$CARGO_REGISTRY_TOKEN"

            published=false
            for attempt in $(seq 1 30); do
              http_status=$(curl -sS -o /dev/null -w "%{http_code}" -A "$UA" "$api_url" || echo 000)
              if [ "$http_status" = "200" ]; then
                published=true
                break
              fi
              sleep 5
            done
            if [ "$published" != true ]; then
              echo "${package_name} ${version} did not become available on crates.io"
              exit 1
            fi

            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists — skip tag push"
            else
              git tag -a "$tag" -m "Release ${crate} v${version}"
              git push origin "$tag"
              if [ "$crate" = "eoka-server" ]; then
                GH_TOKEN="${{ github.token }}" gh workflow run release-eoka-server.yml --repo "${{ github.repository }}" --ref "$tag" -f tag="$tag"
              fi
            fi
            echo "::endgroup::"
          done
