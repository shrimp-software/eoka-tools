name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish missing crate versions
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: shrimp-software/eoka/.github/actions/rust@2e108f041f487df9acc2b04fe5508ec4bf041a56

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish each crate whose version is not on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          UA="eoka-tools-publish (${{ github.repository }})"

          if grep -q '^\[patch.crates-io\]' Cargo.toml; then
            echo "Remove local [patch.crates-io] overrides before publishing eoka-tools."
            exit 1
          fi

          for crate in captcha eoka-proxy eoka-protocol eoka-sdk eoka-email eoka-server eoka-runner eoka-mcp eoka-tack datadome eoka-cli; do
            manifest="crates/${crate}/Cargo.toml"
            [ -f "$manifest" ] || continue

            package_name=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg manifest "$(realpath "$manifest")" \
                '.packages[] | select(.manifest_path == $manifest) | .name')
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg manifest "$(realpath "$manifest")" \
                '.packages[] | select(.manifest_path == $manifest) | .version')
            tag="${crate}-v${version}"
            echo "::group::${package_name} @ ${version}"

            api_url="https://crates.io/api/v1/crates/${package_name}/${version}"
            http_status=$(curl -sS -o /dev/null -w "%{http_code}" -A "$UA" "$api_url" || echo 000)
            if [ "$http_status" = "200" ]; then
              echo "${package_name} ${version} already on crates.io — reconcile release"
            else
              echo "Publishing ${package_name} ${version}"
              cargo publish --manifest-path "$manifest" --token "$CARGO_REGISTRY_TOKEN"

              published=false
              for attempt in $(seq 1 30); do
                http_status=$(curl -sS -o /dev/null -w "%{http_code}" -A "$UA" "$api_url" || echo 000)
                if [ "$http_status" = "200" ]; then
                  published=true
                  break
                fi
                sleep 5
              done
              if [ "$published" != true ]; then
                echo "${package_name} ${version} did not become available on crates.io"
                exit 1
              fi
            fi

            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists — reconcile release"
            else
              git tag -a "$tag" -m "Release ${crate} v${version}"
              git push origin "$tag"
            fi

            if [ "$crate" = "eoka-server" ] || [ "$crate" = "eoka-cli" ]; then
              if GH_TOKEN="${{ github.token }}" gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                echo "Release ${tag} already exists — skip binary release dispatch"
              elif [ "$crate" = "eoka-server" ]; then
                # Released below: together with npm when both ship, so the
                # binaries are qualified once.
                echo "SERVER_TAG=${tag}" >> "$GITHUB_ENV"
              else
                GH_TOKEN="${{ github.token }}" gh workflow run "release-${crate}.yml" --repo "${{ github.repository }}" --ref "$tag" -f tag="$tag"
              fi
            fi
            echo "::endgroup::"
          done

      - name: Start the npm and server releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version clients/node/package.json)
          http_status=$(curl -sS -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@cbxss/eoka/${version}" || echo 000)
          case "$http_status" in
            200) echo "@cbxss/eoka ${version} is already on npm" ;;
            404)
              ready=$(jq -r '.status == "ready" and (.blockers | length) == 0' clients/node/scripts/publication-readiness.json)
              server_tag=""
              # A blocked npm gate must not hold back the server release.
              if [ "$ready" = true ] && [ -n "${SERVER_TAG:-}" ]; then
                server_tag="$SERVER_TAG"
                SERVER_TAG=""
              fi
              echo "Dispatching npm publication of @cbxss/eoka ${version} (server release: ${server_tag:-none})"
              gh workflow run publish-node.yml --repo "${{ github.repository }}" --ref main -f source_sha="$GITHUB_SHA" -f server_tag="$server_tag"
              ;;
            *) echo "npm registry returned ${http_status} for @cbxss/eoka ${version}"; exit 1 ;;
          esac
          if [ -n "${SERVER_TAG:-}" ]; then
            echo "Dispatching standalone release of ${SERVER_TAG}"
            gh workflow run release-eoka-server.yml --repo "${{ github.repository }}" --ref "$SERVER_TAG" -f tag="$SERVER_TAG"
          fi
