name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish missing crate versions
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: shrimp-software/eoka/.github/actions/rust@e6662c5f7faf03b5f6c2979903367003c426b5d4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish each crate whose version is not on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          UA="eoka-tools-publish (${{ github.repository }})"

          if grep -q '^\[patch.crates-io\]' Cargo.toml; then
            echo "Remove local [patch.crates-io] overrides before publishing eoka-tools."
            exit 1
          fi

          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "eoka-cli") | .version')
          echo "VERSION=${version}" >> "$GITHUB_ENV"

          # Dependency order. A crate already on crates.io is skipped, so a
          # partly published release resumes where it stopped.
          for crate in eoka-solvers eoka-protocol eoka-sdk eoka-email eoka-server eoka-runner eoka-mcp eoka-tack eoka-cli; do
            api_url="https://crates.io/api/v1/crates/${crate}/${version}"
            if [ "$(curl -sS -o /dev/null -w "%{http_code}" -A "$UA" "$api_url" || echo 000)" = "200" ]; then
              echo "${crate} ${version} is already on crates.io"
              continue
            fi
            echo "Publishing ${crate} ${version}"
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
            for attempt in $(seq 1 30); do
              [ "$(curl -sS -o /dev/null -w "%{http_code}" -A "$UA" "$api_url" || echo 000)" = "200" ] && continue 2
              sleep 5
            done
            echo "${crate} ${version} did not become available on crates.io"
            exit 1
          done

          tag="v${version}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "Release ${tag}"
            git push origin "$tag"
          fi

      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            github_release=present
          else
            github_release=missing
          fi
          http_status=$(curl -sS -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@cbxss/eoka/${VERSION}" || echo 000)
          case "$http_status" in
            200) npm_release=present ;;
            404) npm_release=missing ;;
            *) echo "npm registry returned ${http_status} for @cbxss/eoka ${VERSION}"; exit 1 ;;
          esac
          tagged="$(git rev-parse "v${VERSION}^{commit}")"
          if [ "$github_release" = present ] && [ "$npm_release" = present ]; then
            echo "v${VERSION} is already on GitHub and npm"
          elif [ "$tagged" != "$GITHUB_SHA" ]; then
            # A later push without a version bump: the release belongs to the
            # tagged commit, so finish or rerun that commit's release run.
            echo "v${VERSION} is tagged at ${tagged}; not starting a release from ${GITHUB_SHA}"
          else
            echo "Dispatching release v${VERSION} (GitHub release ${github_release}, npm ${npm_release})"
            gh workflow run release.yml --repo "${{ github.repository }}" --ref main -f source_sha="$GITHUB_SHA"
          fi
