name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, "sdk/**"]

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Pull requests run only the jobs for the areas they touch; skipped jobs
  # still satisfy the CI OK gate. Pushes run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            printf 'rust=true\ngo=true\nnode=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          area() { grep -qE "$1|^\.github/(workflows/ci\.yml|scripts/)|^(deny\.toml|\.config/)" <<<"$files" && echo true || echo false; }
          {
            echo "rust=$(area '^(crates/|tools/sketchy/|scripts/|Cargo\.(toml|lock)$)')"
            echo "go=$(area '^clients/go/')"
            echo "node=$(area '^(clients/node/|mise\.toml$)')"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint and conformance
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # crate-version check compares against release tags
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Crate versions
        run: bash scripts/check-crate-versions.sh
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - name: Protocol conformance
        run: mise run conformance
      - name: Lesson and media helpers
        run: python3 -m unittest discover -s tools/sketchy -p 'test_*.py'

  surface-parity:
    name: Surface parity
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: node scripts/check-surface-parity.mjs

  unit:
    name: Unit (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features --locked

  go:
    name: Go SDK
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/go
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.21"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race

  node:
    name: Node SDK
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - name: Install SDK dependencies
        run: mise exec -- npm --prefix clients/node ci --ignore-scripts --omit=optional
      - name: Check committed schema projection
        run: mise exec -- node clients/node/scripts/generate-protocol.mjs --check --schema clients/node/src/generated/schema-bundle.json
      - name: Build SDK
        run: mise run node-build
      - name: Check SDK consumers and runtime
        run: |
          mise exec -- node clients/node/scripts/typecheck.mjs
          mise exec -- node --test clients/node/tests/*.test.mjs

  # Real-Chrome tests. The Rust suite is sharded; the Node and Go clients run
  # against the same staged native build in their own job.
  browser:
    name: Browser (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [rust 1/3, rust 2/3, rust 3/3, clients]
    env:
      EOKA_RELIABILITY_SERVER: ${{ github.workspace }}/target/debug/eoka-server
    steps:
      - name: Initialize qualification paths
        run: |
          mkdir -p /var/tmp/er
          {
            echo "TMPDIR=/var/tmp/er"
            echo "EOKA_BROWSER_CACHE_DIR=$RUNNER_TEMP/eoka-browser"
            echo "EOKA_SERVER_ARTIFACTS_DIR=$RUNNER_TEMP/eoka-artifacts"
            echo "EOKA_RELEASE_STAGE_DIR=$RUNNER_TEMP/eoka-stage"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: browser
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: matrix.suite == 'clients'
        with:
          go-version: "1.21"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        if: matrix.suite != 'clients'
        with:
          tool: cargo-nextest
      - name: Prepare Chrome, SDK and native client
        run: .github/scripts/browser-setup.sh
      - name: Rust browser tests (shard ${{ matrix.suite }})
        if: matrix.suite != 'clients'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          xvfb-run -a cargo nextest run --profile ci --workspace --all-features --locked \
            --run-ignored only --partition "hash:${SUITE#rust }"
      - name: Node tests with native artifacts and real Chrome
        if: matrix.suite == 'clients'
        run: xvfb-run -a mise run node-check
      - name: Go race and real-browser tests
        if: matrix.suite == 'clients'
        run: go -C clients/go test -race -count=1 ./...
      - name: Upload test report
        if: always() && matrix.suite != 'clients'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ strategy.job-index }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  deny:
    name: Dependency policy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The only check branch protection requires. Skipped jobs pass.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, lint, surface-parity, unit, go, node, browser, deny]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | map("\(.key): \(.value.result)") | .[]' <<<"$NEEDS")
          if [ -n "$failed" ]; then echo "$failed"; exit 1; fi
          echo "All required jobs passed."
