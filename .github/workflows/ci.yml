name: CI

on:
  pull_request:
    branches: [main, master, "sdk/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Pull requests run only the jobs for the areas they touch; skipped jobs
  # still satisfy the CI OK gate. Manual runs run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            printf 'rust=true\ngo=true\nnode=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          area() { grep -qE "$1|^\.github/(workflows/ci\.yml|scripts/)|^(deny\.toml|\.config/)" <<<"$files" && echo true || echo false; }
          {
            echo "rust=$(area '^(crates/|tools/sketchy/|scripts/|Cargo\.(toml|lock)$)')"
            echo "go=$(area '^clients/go/')"
            echo "node=$(area '^(clients/node/|mise\.toml$)')"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    env:
      RUST: ${{ needs.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # crate-version check compares against release tags
      - name: Surface parity
        run: node scripts/check-surface-parity.mjs
      - name: Release versions are consistent
        run: node scripts/bump-release.mjs --check
      - uses: shrimp-software/eoka/.github/actions/rust@ec4b741b7c109d426a4fa07d2bb0a76d67369cfd
        if: env.RUST == 'true'
        with:
          components: rustfmt, clippy
      - if: env.RUST == 'true'
        run: cargo fmt --all -- --check
      - if: env.RUST == 'true'
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Crate versions
        if: env.RUST == 'true'
        run: bash scripts/check-crate-versions.sh
      # The conformance tests themselves run in the unit job; this is the one
      # conformance rule that is not a test.
      - name: CLI does not depend on eoka-mcp
        if: env.RUST == 'true'
        run: "! cargo tree -p eoka-cli -e normal --depth 1 | grep -q eoka-mcp"
      - name: Lesson and media helpers
        if: env.RUST == 'true'
        run: python3 -m unittest discover -s tools/sketchy -p 'test_*.py'
      - name: Dependency policy
        if: env.RUST == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  unit:
    name: Unit (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, packages: --workspace }
          - { os: macos-15, packages: --workspace }
          # The SDK, CLI, tack client and MCP server use Unix sockets or signals
          # and do not build on Windows; test the crates that ship there.
          - os: windows-2025
            packages: >-
              -p eoka-server -p eoka-runner -p eoka-captcha
              -p eoka-datadome -p eoka-proxy -p eoka-email
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shrimp-software/eoka/.github/actions/rust@ec4b741b7c109d426a4fa07d2bb0a76d67369cfd
      # macOS's per-user TMPDIR is long enough to push session socket paths
      # past the 104-byte limit; give the runtime directory a short base.
      - name: Short runtime directory
        if: runner.os == 'macOS'
        run: echo "XDG_RUNTIME_DIR=/tmp" >> "$GITHUB_ENV"
      - run: cargo test ${{ matrix.packages }} --all-features --locked --no-fail-fast

  # Static checks only: the Go and Node test suites run once, against the
  # native build and real Chrome, in the browser clients job.
  go:
    name: Go SDK
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/go
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.21"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...

  node:
    name: Node SDK
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - name: Install SDK dependencies
        run: mise exec -- npm --prefix clients/node ci --ignore-scripts --omit=optional
      - name: Check committed schema projection
        run: mise exec -- node clients/node/scripts/generate-protocol.mjs --check --schema clients/node/src/generated/schema-bundle.json
      - name: Build SDK
        run: mise run node-build
      - name: Typecheck SDK consumers
        run: mise exec -- node clients/node/scripts/typecheck.mjs

  # Builds once for every browser job: the server and CLI, the Node SDK, and
  # a nextest archive of all Rust test binaries.
  browser-build:
    name: Browser build
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shrimp-software/eoka/.github/actions/rust@ec4b741b7c109d426a4fa07d2bb0a76d67369cfd
        with:
          cache-key: browser
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - name: Build native client, SDK and test archive
        run: |
          set -euo pipefail
          cargo build --locked -p eoka-server -p eoka-cli
          cargo nextest archive --workspace --all-features --locked --archive-file nextest.tar.zst
          mise exec -- npm --prefix clients/node ci --ignore-scripts --omit=optional
          mise run node-build
          tar -czf browser-build.tgz nextest.tar.zst target/debug/eoka-server target/debug/eoka clients/node/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-build
          path: browser-build.tgz
          retention-days: 1

  # Real-Chrome tests from the shared build: the Rust suite in two shards,
  # and the Node and Go test suites against the staged native client.
  browser:
    name: Browser (${{ matrix.suite }})
    needs: browser-build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [rust 1/2, rust 2/2, clients]
    env:
      EOKA_RELIABILITY_SERVER: ${{ github.workspace }}/target/debug/eoka-server
    steps:
      - name: Initialize qualification paths
        run: |
          mkdir -p /var/tmp/er
          {
            echo "TMPDIR=/var/tmp/er"
            echo "EOKA_BROWSER_CACHE_DIR=$RUNNER_TEMP/eoka-browser"
            echo "EOKA_SERVER_ARTIFACTS_DIR=$RUNNER_TEMP/eoka-artifacts"
            echo "EOKA_RELEASE_STAGE_DIR=$RUNNER_TEMP/eoka-stage"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: matrix.suite == 'clients'
        with:
          go-version: "1.21"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        if: matrix.suite != 'clients'
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-build
      - run: tar -xzf browser-build.tgz
      - name: Cache the pinned Chrome download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.EOKA_BROWSER_CACHE_DIR }}
          key: chrome-${{ runner.os }}-${{ hashFiles('clients/node/release-manifest.json') }}
      - name: Prepare Chrome and the staged native client
        run: .github/scripts/browser-setup.sh
      - name: Rust browser tests (shard ${{ matrix.suite }})
        if: matrix.suite != 'clients'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          xvfb-run -a cargo nextest run --profile ci --archive-file nextest.tar.zst \
            --workspace-remap . --run-ignored only --partition "hash:${SUITE#rust }"
      - name: Node tests with native artifacts and real Chrome
        if: matrix.suite == 'clients'
        run: xvfb-run -a mise exec -- node --test clients/node/tests/*.test.mjs
      - name: Go race and real-browser tests
        if: matrix.suite == 'clients'
        run: go -C clients/go test -race -count=1 ./...
      - name: Upload test report
        if: always() && matrix.suite != 'clients'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ strategy.job-index }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore


  # The only check branch protection requires. Skipped jobs pass.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, lint, unit, go, node, browser-build, browser]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | map("\(.key): \(.value.result)") | .[]' <<<"$NEEDS")
          if [ -n "$failed" ]; then echo "$failed"; exit 1; fi
          echo "All required jobs passed."

