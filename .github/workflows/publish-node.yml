name: Publish Node prerelease

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit currently at main; publishes the SDK version in clients/node/package.json to latest
        required: true
        type: string
      server_tag:
        description: eoka-server tag on this commit to release on GitHub from this run's qualified binaries
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: npm-prerelease-publication
  cancel-in-progress: false

jobs:
  gate:
    name: Verify source
    runs-on: ubuntu-22.04
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - name: Publish only the dispatched main commit with consistent versions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          if grep -q '^\[patch.crates-io\]' Cargo.toml; then echo "Remove [patch.crates-io] before publishing"; exit 1; fi
          mise exec -- node scripts/bump-release.mjs --check

  qualify:
    name: Qualify exact publication payload
    needs: gate
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/qualify-node-release.yml
    with:
      source_ref: ${{ github.sha }}
      publication: true

  server-release:
    name: GitHub release for the qualified server
    needs: [gate, qualify]
    if: inputs.server_tag != ''
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-eoka-server.yml
    with:
      tag: ${{ inputs.server_tag }}
      qualified: true

  publish:
    name: Publish platform packages then SDK to latest
    needs: [gate, qualify]
    runs-on: ubuntu-22.04
    environment:
      name: npm-prerelease
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: node-release-candidates
          path: packages
      - name: Publish with trusted OIDC and provenance
        run: mise exec -- node clients/node/scripts/publish-release.mjs publish packages

  registry-smoke:
    name: Clean registry install and browser smoke
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
      - name: Install Chrome runtime dependencies
        run: .github/scripts/chrome-deps.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: node-release-candidates
          path: packages
      - name: Verify registry integrity and signatures, then run a browser smoke
        run: mise exec -- node clients/node/scripts/publish-release.mjs smoke packages
