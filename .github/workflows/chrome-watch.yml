name: Chrome watch

# Weekly: when Chrome for Testing Stable moves past the pinned build, open a
# PR here (manifest, digests, readiness) and a companion PR in eoka
# (.github/chrome-version). Both PRs run full CI and qualification.
on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Chrome for Testing build to pin (default latest Stable)
        required: false
      dry_run:
        description: Show the diff without opening PRs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chrome-watch
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # PRs opened with GITHUB_TOKEN do not trigger CI, so use a token
          # that can push branches and open PRs in eoka-tools and eoka.
          token: ${{ secrets.CHROME_WATCH_TOKEN || github.token }}
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: mise exec -- node scripts/bump-chrome.mjs ${VERSION:+--version "$VERSION"} | tee -a "$GITHUB_OUTPUT"
      - name: Show changes
        run: git diff
      - name: Open eoka-tools PR
        if: steps.bump.outputs.updated == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.CHROME_WATCH_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::CHROME_WATCH_TOKEN secret is not set"; exit 1; }
          branch="chore/chrome-${VERSION}"
          if gh pr list --head "$branch" --json number --jq '.[0].number' | grep -q .; then
            echo "PR for ${branch} already open"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: pin Chrome for Testing ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: pin Chrome for Testing ${VERSION}" --body \
            "Chrome for Testing Stable moved from ${PREVIOUS} to ${VERSION}. Archive digests were recomputed from the downloads. Qualification runs on this PR; merge once it and CI are green."
      - name: Open eoka companion PR
        if: steps.bump.outputs.updated == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.CHROME_WATCH_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::CHROME_WATCH_TOKEN secret is not set"; exit 1; }
          branch="chore/chrome-${VERSION}"
          if gh pr list -R shrimp-software/eoka --head "$branch" --json number --jq '.[0].number' | grep -q .; then
            echo "eoka PR for ${branch} already open"; exit 0
          fi
          gh repo clone shrimp-software/eoka eoka -- --depth 1
          cd eoka
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          echo "$VERSION" > .github/chrome-version
          git commit -am "ci: test against Chrome for Testing ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "ci: test against Chrome for Testing ${VERSION}" --body \
            "Companion to the eoka-tools Chrome ${VERSION} pin. Browser tests run against the new build."
