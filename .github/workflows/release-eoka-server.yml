name: Release eoka-server

# The GitHub release ships the exact binaries that passed native release
# builds, recording tests and packed runtime qualification: the qualify
# workflow builds them and this workflow only publishes its artifacts.
on:
  push:
    tags:
      - "eoka-server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. eoka-server-v0.1.0)"
        required: true
      dry_run:
        description: Qualify and collect the assets without creating a release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify release binaries
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/qualify-node-release.yml
    with:
      source_ref: ${{ inputs.tag || github.ref_name }}
      publication: false

  release:
    name: Publish release
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.qualify.outputs.source-sha }}
          persist-credentials: false
      - name: Tag matches the server version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/eoka-server/Cargo.toml | head -1)
          test "$TAG" = "eoka-server-v${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: node-native-*
          path: native
          merge-multiple: true
      - name: Collect qualified binaries and checksums
        run: |
          set -euo pipefail
          mkdir dist
          for asset in eoka-server-linux-amd64 eoka-server-linux-arm64 eoka-server-darwin-amd64 eoka-server-darwin-arm64 eoka-server-windows-amd64.exe; do
            cp "native/${asset}" "dist/${asset}"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -lh dist
          cat dist/checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.dry_run
        with:
          name: release-assets
          path: dist/
          retention-days: 7
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: ${{ !inputs.dry_run }}
        with:
          tag_name: ${{ env.TAG }}
          name: eoka-server v${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
