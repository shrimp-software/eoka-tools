name: Release eoka-server

# The GitHub release ships the exact binaries that passed native release
# builds, recording tests and packed runtime qualification: the qualify
# workflow builds them and this workflow only publishes its artifacts.
on:
  push:
    tags:
      - "eoka-server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. eoka-server-v0.1.0)"
        required: true
      dry_run:
        description: Qualify and collect the assets without creating a release
        type: boolean
        default: false
  # publish-node.yml calls this after its own qualification so a release that
  # also publishes npm builds and qualifies the binaries once.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      qualified:
        description: The calling run already qualified this tag's binaries
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify release binaries
    if: ${{ !inputs.qualified }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/qualify-node-release.yml
    with:
      source_ref: ${{ inputs.tag || github.ref_name }}
      publication: false

  release:
    name: Publish release
    needs: qualify
    if: always() && (needs.qualify.result == 'success' || (inputs.qualified && needs.qualify.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Tag matches the server version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/eoka-server/Cargo.toml | head -1)
          test "$TAG" = "eoka-server-v${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-native-*
          path: native
          merge-multiple: true
      - name: Collect qualified binaries and checksums
        run: |
          set -euo pipefail
          mkdir dist
          for asset in eoka-server-linux-amd64 eoka-server-linux-arm64 eoka-server-darwin-amd64 eoka-server-darwin-arm64 eoka-server-windows-amd64.exe; do
            cp "native/${asset}" "dist/${asset}"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -lh dist
          cat dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.dry_run
        with:
          name: release-assets
          path: dist/
          retention-days: 7
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ !inputs.dry_run }}
        with:
          tag_name: ${{ env.TAG }}
          name: eoka-server v${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
