name: Release eoka-server

on:
  push:
    tags:
      - "eoka-server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. eoka-server-v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  parse:
    name: Parse tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - id: parse
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#eoka-server-v}"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build ${{ matrix.target }} (glibc 2.35)
    needs: parse
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: eoka-server-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset: eoka-server-linux-arm64
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    permissions:
      contents: read
    steps:
      - name: Install baseline build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev ca-certificates curl git
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: glibc-2.35-${{ matrix.target }}-eoka-server
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p eoka-server
      - name: Stage asset
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/eoka-server" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-hosted:
    name: Build ${{ matrix.target }}
    needs: parse
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: eoka-server-windows-amd64.exe
            ext: .exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}-eoka-server

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p eoka-server

      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp "target/${{ matrix.target }}/release/eoka-server${{ matrix.ext }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-macos:
    name: Build ${{ matrix.target }}
    needs: parse
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            asset: eoka-server-darwin-amd64
          - target: aarch64-apple-darwin
            asset: eoka-server-darwin-arm64
    # Use GitHub-hosted macOS runners so releases do not depend on a local pool.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}-eoka-server

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p eoka-server

      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp "target/${{ matrix.target }}/release/eoka-server" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [parse, build-linux, build-hosted, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: List artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.parse.outputs.tag }}
          name: eoka-server v${{ needs.parse.outputs.version }}
          generate_release_notes: true
          files: dist/*
