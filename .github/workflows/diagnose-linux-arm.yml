name: diagnose-linux-arm

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Existing qualification run containing node-release-candidates
        type: string
        required: true
      source_ref:
        description: Exact tools commit containing the diagnostic script
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate diagnostic inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - name: Install diagnostic prerequisites without changing security policy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git xz-utils unzip libnss3 libgbm1 fonts-liberation procps binutils file util-linux apparmor-utils
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: node-release-candidates
          path: packages
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Capture sandbox-enabled raw and managed startup evidence
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EOKA_SOURCE_SHA: ${{ inputs.source_ref }}
        run: mise exec -- node clients/node/scripts/diagnose-linux-arm.mjs packages evidence/diagnose-linux-arm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnose-linux-arm
          path: evidence/diagnose-linux-arm/
          if-no-files-found: error
          retention-days: 14
