name: Diagnose macOS launch

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-macos-launch.yml'
  workflow_dispatch:
    inputs:
      before_core_ref:
        description: Exact pre-fix core commit SHA
        type: string
        required: true
      fixed_core_ref:
        description: Exact fixed core commit SHA
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-x64
            os: macos-15-intel
          - platform: darwin-arm64
            os: macos-15
    steps:
      - name: Validate immutable inputs
        env:
          BEFORE: ${{ inputs.before_core_ref }}
          FIXED: ${{ inputs.fixed_core_ref }}
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$FIXED" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: shrimp-software/eoka
          ref: ${{ inputs.before_core_ref }}
          path: .diagnostic-core-before
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: shrimp-software/eoka
          ref: ${{ inputs.fixed_core_ref }}
          path: .diagnostic-core-fixed
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - name: Build two immutable diagnostic sidecars and SDK
        env:
          BEFORE: ${{ inputs.before_core_ref }}
          FIXED: ${{ inputs.fixed_core_ref }}
          CARGO_HOME: ${{ runner.temp }}/diagnostic-cargo
        run: |
          set -euo pipefail
          test "$(git -C .diagnostic-core-before rev-parse HEAD)" = "$BEFORE"
          test "$(git -C .diagnostic-core-fixed rev-parse HEAD)" = "$FIXED"
          mkdir -p diagnostic
          for variant in before fixed; do
            core_path="$RUNNER_TEMP/diagnostic-core-$variant"
            mv ".diagnostic-core-$variant" "$core_path"
            cargo --config "patch.crates-io.eoka.path='$core_path'" build --release -p eoka-server
            cp target/release/eoka-server "diagnostic/eoka-server-$variant"
            cargo --config "patch.crates-io.eoka.path='$core_path'" metadata --format-version 1 > "diagnostic/$variant-cargo.json"
            cp Cargo.lock "diagnostic/$variant-Cargo.lock"
            cp clients/node/scripts/signing-cache-probe.rs "$core_path/examples/signing_cache_probe.rs"
            mkdir "$RUNNER_TEMP/signing-cache-$variant"
            TMPDIR="$RUNNER_TEMP/signing-cache-$variant" cargo run --manifest-path "$core_path/Cargo.toml" --target-dir target --release --locked --example signing_cache_probe > "diagnostic/$variant-signing-cache.json"
            rm "$core_path/examples/signing_cache_probe.rs"
          done
          cargo test --manifest-path "$core_path/Cargo.toml" --target-dir target --release --lib --locked stealth::patcher::macos_bundle_tests
          mise exec -- node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const before = JSON.parse(readFileSync("diagnostic/before-signing-cache.json"));
            const fixed = JSON.parse(readFileSync("diagnostic/fixed-signing-cache.json"));
            assert.equal(before.cacheAccepted, true);
            assert.equal(before.secondError, false);
            assert.deepEqual(fixed, { firstError: true, cacheAccepted: false, secondError: true, originalUnchanged: true });
          '
          mise exec -- npm --prefix clients/node ci --ignore-scripts --omit=optional
          mise exec -- npm --prefix clients/node run build
      - name: Diagnose raw and managed launch without retries
        env:
          BEFORE_CORE_REF: ${{ inputs.before_core_ref }}
          FIXED_CORE_REF: ${{ inputs.fixed_core_ref }}
          TOOLS_SOURCE_SHA: ${{ github.sha }}
        run: |
          mise exec -- node clients/node/scripts/diagnose-macos-launch.mjs --before diagnostic/eoka-server-before --fixed diagnostic/eoka-server-fixed --output diagnostic/evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnose-macos-launch-${{ matrix.platform }}
          path: diagnostic/
          if-no-files-found: error
          retention-days: 14
