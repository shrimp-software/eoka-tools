name: Dependabot merge

# Approves Dependabot's minor and patch updates and adds them to the merge
# queue, which merges each once CI OK passes on top of main. Major updates
# stay open for review. RELEASE_TOKEN is a fine-grained token of the
# repository owner (Actions and Dependabot secret): its merges start the push
# workflows, which GITHUB_TOKEN merges would not.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Approve and queue
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
