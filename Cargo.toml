[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/shrimp-software/eoka-tools"
homepage = "https://github.com/shrimp-software/eoka-tools"
authors = ["cbxss"]

[workspace.dependencies]
# eoka and the workspace crates, versioned once here. eoka-server pins eoka
# exactly in its own manifest so its release binaries match qualification.
eoka = "0.9.1"
captcha = { package = "eoka-captcha", version = "0.1.1", path = "crates/captcha" }
eoka-datadome = { version = "0.5.0", path = "crates/datadome" }
eoka-email = { version = "0.1.0", path = "crates/eoka-email" }
eoka-protocol = { version = "0.8.0", path = "crates/eoka-protocol" }
eoka-proxy = { version = "0.2.0", path = "crates/eoka-proxy" }
eoka-sdk = { version = "0.9.0", path = "crates/eoka-sdk" }
eoka-server = { version = "0.8.1", path = "crates/eoka-server" }
eoka-tack = { version = "0.8.0", path = "crates/eoka-tack" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tack-core = { version = "0.0.2", features = ["schemars"] }
tack-runtime-quickjs = "0.0.2"
tokio = { version = "1", features = ["full"] }
