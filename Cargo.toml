[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.22.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shrimp-software/eoka-tools"
authors = ["cbxss"]

[workspace.dependencies]
# eoka and the workspace crates. Every workspace crate shares the
# [workspace.package] version; scripts/bump-release.mjs writes it here too.
# eoka-server pins eoka exactly so its release binaries match qualification.
eoka = "0.10.2"
eoka-solvers = { version = "0.22.0", path = "crates/eoka-solvers", default-features = false }
eoka-email = { version = "0.22.0", path = "crates/eoka-email" }
eoka-protocol = { version = "0.22.0", path = "crates/eoka-protocol" }
eoka-sdk = { version = "0.22.0", path = "crates/eoka-sdk" }
eoka-server = { version = "0.22.0", path = "crates/eoka-server", default-features = false }
eoka-tack = { version = "0.22.0", path = "crates/eoka-tack" }
eoka-mcp = { version = "0.22.0", path = "crates/eoka-mcp", default-features = false }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tack-core = { version = "0.0.2", features = ["schemars"] }
tack-runtime-quickjs = "0.0.2"
tokio = { version = "1", features = ["full"] }
